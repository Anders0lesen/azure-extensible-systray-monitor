[package]
name = "azure-health-beacon"
version = "0.8.0"
description = "Local-first Azure signal monitor for Windows 11"
authors = ["Anders Olesen"]
license = "Unlicense"
repository = "https://github.com/Anders0lesen/azure-extensible-systray-monitor"
edition = "2024"
rust-version = "1.85"

[lib]
name = "azure_health_beacon"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
log = "=0.4.29"
oauth2 = { version = "=5.0.0", default-features = false, features = ["native-tls", "reqwest-blocking"] }
rand = "=0.10.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-log = "=2.9.1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem"
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
