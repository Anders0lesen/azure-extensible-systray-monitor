[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-extensible-systray-monitor"
version = "0.3.0"
description = "A Windows 11 Azure health beacon with credential-safe onboarding"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
dependencies = [
  "Pillow==12.3.0",
  "pystray==0.19.5",
]

[project.scripts]
azure-health-beacon = "azure_health_beacon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["B", "BLE", "DTZ", "E4", "E7", "E9", "F", "I", "LOG", "TRY", "UP"]
ignore = ["TRY003", "TRY301"] # User-facing validation messages belong at their raise sites.

[tool.ruff.lint.per-file-ignores]
"src/azure_health_beacon/app.py" = ["BLE001"] # UI boundaries convert unexpected failures into dialogs.
