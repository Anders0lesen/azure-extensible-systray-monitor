name: Rust preview validation

on:
  push:
    branches:
      - rewrite/rust-tauri-v0.8
  pull_request:
    paths:
      - "src-tauri/**"
      - "web/**"
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
      - ".github/workflows/rust-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.8.0"

      - name: Use pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Use pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate web interface
        run: |
          pnpm check:web
          pnpm build:web

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile and lint Rust
        shell: pwsh
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 |
            Tee-Object -FilePath clippy-output.txt
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content clippy-output.txt
            $firstError = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^error(?:\[|:)' } | Select-Object -First 1
            $details = if ($null -ne $firstError) { ($lines[$firstError..($lines.Count - 1)] -join "`n") } else { ($lines[-80..-1] -join "`n") }
            if ($details.Length -gt 3900) { $details = $details.Substring(0, 3900) }
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Rust compiler output::$details"
            exit 1
          }

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
