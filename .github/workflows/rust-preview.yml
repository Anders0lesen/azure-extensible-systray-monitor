name: Rust preview validation

on:
  push:
    branches:
      - rewrite/rust-tauri-v0.8
  pull_request:
    paths:
      - "src-tauri/**"
      - "web/**"
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
      - ".github/workflows/rust-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.8.0"

      - name: Use pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Use pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate web interface
        run: |
          pnpm check:web
          pnpm build:web

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile and lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
