name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify version
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          python scripts/write_version_info.py build/version_info.txt --expected $Version
      - name: Lint, test, and audit
        shell: pwsh
        run: |
          python -m ruff check .
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          python -m unittest discover -s tests -v
          python -m pip_audit -r requirements-dev.txt
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AzureHealthBeacon `
            --icon assets/AzureHealthBeacon.ico `
            --add-data "assets/AzureHealthBeacon.ico;assets" `
            --version-file build/version_info.txt `
            --paths src launcher.py
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $Download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $InnoDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' `
            -OutFile $Download
          $Signature = Get-AuthenticodeSignature -LiteralPath $Download
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notlike '*CN=Pyrsys B.V.*') {
            throw 'The Inno Setup compiler did not have the expected valid signature.'
          }
          $Process = Start-Process -FilePath $Download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', "/DIR=$InnoDir"
          ) -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($Process.ExitCode)" }
          "INNO_DIR=$InnoDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "$env:INNO_DIR\ISCC.exe" "/DAppVersion=$Version" installer/AzureHealthBeacon.iss
          $Asset = "dist\AzureHealthBeacon-Setup-$env:GITHUB_REF_NAME.exe"
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Asset).Hash.ToLowerInvariant()
          "$Hash *$([IO.Path]::GetFileName($Asset))" | Set-Content -Encoding ascii "$Asset.sha256"
      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/AzureHealthBeacon-Setup-*.exe
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          gh release create $env:GITHUB_REF_NAME `
            dist/AzureHealthBeacon-Setup-*.exe `
            dist/AzureHealthBeacon-Setup-*.sha256 `
            --verify-tag `
            --latest `
            --title "Azure Health Beacon $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file $Notes
