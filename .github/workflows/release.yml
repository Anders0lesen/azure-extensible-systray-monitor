name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify version
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          python scripts/write_version_info.py build/version_info.txt --expected $Version
      - name: Lint, test, and audit
        shell: pwsh
        run: |
          python -m ruff check .
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          python -m unittest discover -s tests -v
          python -m pip_audit -r requirements-dev.txt
      - name: Build application
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name AzureHealthBeaconCore `
            --icon assets/AzureHealthBeacon.ico `
            --version-file build/version_info.txt `
            --paths src core_launcher.py
          dotnet publish src/windows/AzureHealthBeacon.Shell/AzureHealthBeacon.Shell.csproj `
            -c Release -r win-x64 --self-contained true -o build/windows-shell `
            "/p:Version=$Version" "/p:AssemblyVersion=$Version.0" "/p:FileVersion=$Version.0"
          Copy-Item -LiteralPath build/windows-shell/AzureHealthBeacon.exe -Destination dist/AzureHealthBeacon.exe
      - name: Exercise first use and no-preselection rule flow
        shell: pwsh
        run: scripts/test_windows_shell.ps1 -ShellPath dist/AzureHealthBeacon.exe -CorePath dist/AzureHealthBeaconCore.exe
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $Download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $InnoDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' `
            -OutFile $Download
          $Signature = Get-AuthenticodeSignature -LiteralPath $Download
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notlike '*CN=Pyrsys B.V.*') {
            throw 'The Inno Setup compiler did not have the expected valid signature.'
          }
          $Process = Start-Process -FilePath $Download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', "/DIR=$InnoDir"
          ) -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($Process.ExitCode)" }
          "INNO_DIR=$InnoDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "$env:INNO_DIR\ISCC.exe" "/DAppVersion=$Version" installer/AzureHealthBeacon.iss
          $Asset = "dist\AzureHealthBeacon-Setup-$env:GITHUB_REF_NAME.exe"
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Asset).Hash.ToLowerInvariant()
          "$Hash *$([IO.Path]::GetFileName($Asset))" | Set-Content -Encoding ascii "$Asset.sha256"
      - name: Verify 0.7.1 in-place upgrade and contaminated restart
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Asset = Join-Path $env:GITHUB_WORKSPACE "dist\AzureHealthBeacon-Setup-$env:GITHUB_REF_NAME.exe"
          $InstallDir = Join-Path $env:RUNNER_TEMP 'beacon-restart-test'
          $InstallExe = Join-Path $InstallDir 'AzureHealthBeacon.exe'
          $CoreExe = Join-Path $InstallDir 'AzureHealthBeaconCore.exe'
          $StaleRuntime = Join-Path $env:RUNNER_TEMP '_MEI-stale-runtime'
          New-Item -ItemType Directory -Path $StaleRuntime -Force | Out-Null

          # Install the currently public WPF-shell release first. The
          # new installer must replace it in place without a second wizard or
          # data migration step.
          $PreviousDir = Join-Path $env:RUNNER_TEMP 'beacon-v071'
          New-Item -ItemType Directory -Path $PreviousDir -Force | Out-Null
          $PreviousInstaller = Join-Path $PreviousDir 'AzureHealthBeacon-Setup-v0.7.1.exe'
          $PreviousChecksum = "$PreviousInstaller.sha256"
          Invoke-WebRequest -Uri 'https://github.com/Anders0lesen/azure-extensible-systray-monitor/releases/download/v0.7.1/AzureHealthBeacon-Setup-v0.7.1.exe' -OutFile $PreviousInstaller
          Invoke-WebRequest -Uri 'https://github.com/Anders0lesen/azure-extensible-systray-monitor/releases/download/v0.7.1/AzureHealthBeacon-Setup-v0.7.1.exe.sha256' -OutFile $PreviousChecksum
          $ExpectedPrevious = ((Get-Content -LiteralPath $PreviousChecksum -Raw) -split '\s+')[0].ToLowerInvariant()
          $ActualPrevious = (Get-FileHash -LiteralPath $PreviousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualPrevious -ne $ExpectedPrevious) { throw 'The downloaded 0.7.1 installer checksum did not match.' }
          # Process.WaitForExit follows only Setup itself. Start-Process -Wait
          # follows Setup's launched Beacon too, which makes a successful old
          # installation look like a hung test.
          $OldStartInfo = [Diagnostics.ProcessStartInfo]::new()
          $OldStartInfo.FileName = $PreviousInstaller
          $OldStartInfo.UseShellExecute = $false
          $OldStartInfo.CreateNoWindow = $true
          foreach ($Argument in @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$InstallDir"
          )) {
            $OldStartInfo.ArgumentList.Add($Argument)
          }
          $OldSetup = [Diagnostics.Process]::Start($OldStartInfo)
          if (-not $OldSetup.WaitForExit(120000)) {
            $OldSetup.Kill($true)
            throw 'The 0.7.1 setup did not exit within two minutes.'
          }
          if ($OldSetup.ExitCode -ne 0) { throw "The 0.7.1 setup failed: $($OldSetup.ExitCode)" }
          Start-Sleep -Seconds 5
          $OldVersion = (Get-Item -LiteralPath $InstallExe).VersionInfo.ProductVersion.Trim()
          if ($OldVersion -ne '0.7.1') { throw "Expected 0.7.1 before upgrade, found $OldVersion." }

          # The in-app updater starts Setup and then exits. Reproduce that
          # handoff exactly before asking the new installer to replace files.
          Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'AzureHealthBeacon.exe' -and $_.ExecutablePath -eq $InstallExe
          } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $StopDeadline = [DateTime]::UtcNow.AddSeconds(20)
          do {
            $OldRunning = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'AzureHealthBeacon.exe' -and $_.ExecutablePath -eq $InstallExe
            }
            if (-not $OldRunning) { break }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $StopDeadline)
          if ($OldRunning) { throw 'The 0.7.1 Beacon did not exit for the updater handoff.' }

          # Reproduce the environment inherited when an older onefile build
          # starts Setup, exits, and deletes its temporary Python runtime.
          $env:_PYI_ARCHIVE_FILE = $InstallExe
          $env:_PYI_APPLICATION_HOME_DIR = $StaleRuntime
          $env:_PYI_PARENT_PROCESS_LEVEL = '2'
          Remove-Item Env:PYINSTALLER_RESET_ENVIRONMENT -ErrorAction SilentlyContinue

          $StartInfo = [Diagnostics.ProcessStartInfo]::new()
          $StartInfo.FileName = $Asset
          $StartInfo.UseShellExecute = $false
          $StartInfo.CreateNoWindow = $true
          foreach ($Argument in @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS',
            '/RESTARTAPPLICATIONS', "/DIR=$InstallDir"
          )) {
            $StartInfo.ArgumentList.Add($Argument)
          }
          $Setup = [Diagnostics.Process]::Start($StartInfo)
          if (-not $Setup.WaitForExit(120000)) {
            $Setup.Kill($true)
            throw 'Restart-test installer did not exit within two minutes.'
          }
          if ($Setup.ExitCode -ne 0) {
            throw "Restart-test installer failed with exit code $($Setup.ExitCode)."
          }

          Start-Sleep -Seconds 8
          $Running = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'AzureHealthBeacon.exe' -and $_.ExecutablePath -eq $InstallExe
          }
          if (-not $Running) {
            throw 'The installed Beacon did not survive the contaminated _MEI restart.'
          }
          if (-not (Test-Path -LiteralPath $CoreExe)) {
            throw 'The private monitoring engine was not installed.'
          }
          $InstalledVersion = (Get-Item -LiteralPath $InstallExe).VersionInfo.ProductVersion.Trim()
          if ($InstalledVersion -ne $Version) {
            throw "Restarted version $InstalledVersion did not match $Version."
          }
          $Running | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'AzureHealthBeaconCore.exe' -and $_.ExecutablePath -eq $CoreExe
          } | ForEach-Object {
            # Stopping the shell normally ends the private engine before this
            # process snapshot is consumed.
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/AzureHealthBeacon-Setup-*.exe
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          gh release create $env:GITHUB_REF_NAME `
            dist/AzureHealthBeacon-Setup-*.exe `
            dist/AzureHealthBeacon-Setup-*.sha256 `
            --verify-tag `
            --latest `
            --title "Azure Health Beacon $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file $Notes
